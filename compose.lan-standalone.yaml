# Standalone LAN stack: copy only this file to the server, then
# `docker compose -f compose.lan-standalone.yaml pull && ... up -d`.
# The host must own 192.168.162.16. This file does not read .env.
services:
  server:
    image: ghcr.io/acelith/chronexus-server:main
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    environment:
      CHRONEXUS_PUBLIC_ORIGIN: https://192.168.162.16:10050
      CHRONEXUS_LISTEN: 0.0.0.0:8080
      CHRONEXUS_DATABASE: /var/lib/chronexus/chronexus.sqlite3
      CHRONEXUS_TRUSTED_PROXIES: 10.203.162.2/32
      # Operator accounts (comma-separated); takes effect once the account exists.
      CHRONEXUS_OPERATORS: acelith
    volumes:
      - server-data:/var/lib/chronexus
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: [CMD, chronexus-server, healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks: [backend]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    ports:
      - "192.168.162.16:10050:443"  # host port 443 belongs to Pi-hole
    # Compose cannot inject inline configs into a read-only container, so the
    # Caddyfile travels in the environment and is written to the /tmp tmpfs.
    entrypoint: [/bin/sh, -c]
    command: ['printf "%s" "$$CADDYFILE" > /tmp/Caddyfile && exec caddy run --config /tmp/Caddyfile --adapter caddyfile']
    environment:
      CADDYFILE: |
        {
            # Clients send no SNI for an IP address; pick the certificate anyway.
            default_sni 192.168.162.16
        }
        192.168.162.16 {
            tls internal
            log {
                output discard
            }
            reverse_proxy server:8080 {
                flush_interval -1
                transport http {
                    read_timeout 15m
                }
                header_up Host {http.request.hostport}
                header_up X-Forwarded-Proto https
                header_up X-Forwarded-For {remote_host}
            }
        }
    volumes:
      - proxy-data:/data
      - proxy-config:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    depends_on:
      server:
        condition: service_healthy
    networks:
      backend:
        ipv4_address: 10.203.162.2

volumes:
  server-data:
  proxy-data:
  proxy-config:

networks:
  backend:
    ipam:
      config:
        - subnet: 10.203.162.0/24
          gateway: 10.203.162.1
          ip_range: 10.203.162.128/25
