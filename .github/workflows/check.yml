name: Server checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check-public-origin.py --history --origin
      - run: python3 -m unittest discover -s scripts -p test_github_release.py
      - run: python3 -m unittest discover -s scripts -p test_public_origin.py
      - name: Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy && rustup default 1.97.0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: python3 scripts/contract.py --check
      - name: Compose configuration
        env:
          CHRONEXUS_DOMAIN: sync.example.test
          CHRONEXUS_PUBLIC_ORIGIN: https://sync.example.test
        run: docker compose config --quiet
  audit:
    # Advisory only until the first release is qualified: it reports, it does not block.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked
      - run: cargo audit
