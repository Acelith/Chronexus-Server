[package]
name = "chronexus-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Optional self-hosted campaign companion for Chronexus"
publish = false

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
argon2 = "0.5.3"
getrandom = "0.4"
sha2 = "0.10.9"
uuid = { version = "1", features = ["v4", "v7"] }
futures-core = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
url = "2"
ipnet = "2"
utoipa = { version = "5.5", features = ["axum_extras"] }
zeroize = "1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
