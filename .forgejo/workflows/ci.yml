# Forgejo Actions on github.com (M30). Forgejo prefers this folder over .github/workflows.
# Needs a runner with the `docker` label; jobs run in pinned containers, so a runner on any
# Linux or macOS Docker host behaves the same. Local equivalent: cargo commands below, or
# the application's scripts/qa/run-all.sh with CHRONEXUS_SERVER_REPO set.
name: Server CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: docker
    container:
      image: rust:1.97-bookworm
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 scripts/contract.py --check
  audit:
    # Advisory: reports advisories without blocking until the policy decides otherwise.
    runs-on: docker
    continue-on-error: true
    container:
      image: rust:1.97-bookworm
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - run: cargo install cargo-audit --locked
      - run: cargo audit
